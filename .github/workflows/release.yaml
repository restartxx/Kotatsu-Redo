name: Release Build (Kamikaze Mode)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout App code
        uses: actions/checkout@v4

      # --- A INJEÇÃO KAMIKAZE ---
      # Baixamos seu arquivo .kt cru e jogamos dentro da pasta do APP (não do parser)
      # Assim ele compila junto com a interface do usuário.
      
      - name: Inject Parser directly into App Source
        run: |
          echo "💉 Injetando código direto na veia do App..."
          
          # 1. Cria a pasta de pacote dentro do código fonte do APP
          # Usamos um pacote que já existe (ui) ou criamos um novo
          mkdir -p app/src/main/kotlin/org/koitharu/kotatsu/parsers/injected
          
          # 2. Baixa o arquivo RAW do seu repositório (ajuste o link se precisar)
          # Estou assumindo que o arquivo HomeLabParsers.kt está na raiz ou pasta conhecida do seu repo
          wget https://raw.githubusercontent.com/restartxx/kotatsu-parsers-redo/refs/heads/master/src/main/kotlin/org/koitharu/kotatsu/parsers/site/all/HomeLabParsers.kt -O temp_parser.kt
          
          # 3. CORREÇÃO DE PACOTE (Cirurgia no texto)
          # Mudamos o 'package' do arquivo para bater com a pasta onde vamos colocar
          sed -i 's|package .*|package org.koitharu.kotatsu.parsers.injected|' temp_parser.kt
          
          # 4. Move para a pasta final
          mv temp_parser.kt app/src/main/kotlin/org/koitharu/kotatsu/parsers/injected/HomeLabParsers.kt
          
          echo "--- ARQUIVO INJETADO ---"
          head -n 5 app/src/main/kotlin/org/koitharu/kotatsu/parsers/injected/HomeLabParsers.kt

      # --- FIM DA INJEÇÃO ---

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Get version
        id: version
        run: |
            TAG=${GITHUB_REF#refs/tags/}
            VERSION=${TAG#v}
            # Fallback para workflow_dispatch sem tag
            if [ -z "$VERSION" ]; then VERSION="1.0.0"; fi
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "version_code=10000" >> $GITHUB_OUTPUT

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > keystore.jks

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Build normal, sem inventar moda nas dependências
          ./gradlew assembleRelease \
            -PversionName=${{ steps.version.outputs.version }} \
            -PversionCode=${{ steps.version.outputs.version_code }} \
            -x lint

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Cleanup
        if: always()
        run: rm -f keystore.jks
