name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout App code
        uses: actions/checkout@v4

      # --- INICIO DA INJEÇÃO DOS PARSERS ---
      
      - name: Checkout Custom Parsers
        uses: actions/checkout@v4
        with:
          repository: restartxx/kotatsu-parsers-redo 
          path: kotatsu-parsers 
          ref: master

      - name: Force Local Parsers Module (Hardcore Rewrite)
        run: |
          echo "🔥 Aplicando Reescrita Total do Módulo de Parsers..."

          # 1. Configura settings.gradle do App
          echo "include ':kotatsu-parsers'" >> settings.gradle

          # 2. Linkagem no app/build.gradle (Perl method)
          perl -0777 -i -pe 's|implementation\("com\.github\.clquwu:kotatsu-parsers-redo:\$parsersVersion"\)\s*\{\s*exclude group: \x27org\.json\x27, module: \x27json\x27\s*\}|implementation project(":kotatsu-parsers")|g' app/build.gradle
          
          # ==================================================================================
          # 3. A GRANDE REESCRITA DO BUILD.GRADLE.KTS DO PARSER
          # O objetivo é remover TODAS as referências a 'libs.*' e 'tasks.*' que quebram
          # ==================================================================================
          
          PARSER_BUILD="kotatsu-parsers/build.gradle.kts"
          
          if [ -f "$PARSER_BUILD" ]; then
             echo "Reescrevendo $PARSER_BUILD..."

             # A. Remove imports problemáticos (Tasks de relatório)
             sed -i '/import tasks.ReportGenerateTask/d' $PARSER_BUILD
             
             # B. Remove o registro da task de relatório no final do arquivo
             sed -i '/tasks.register<ReportGenerateTask>/d' $PARSER_BUILD

             # C. Substitui Plugins (libs.plugins -> id direto)
             sed -i 's|alias(libs.plugins.kotlin.jvm)|id("org.jetbrains.kotlin.jvm")|g' $PARSER_BUILD
             sed -i 's|alias(libs.plugins.kotlin.serialization)|id("org.jetbrains.kotlin.plugin.serialization")|g' $PARSER_BUILD
             
             # D. Substitui Dependências (libs.x -> string direta)
             # Essas versões são as padrão usadas no ecossistema Kotatsu/Android atual
             
             # Kotlin Coroutines
             sed -i 's|libs.kotlinx.coroutines.core|"org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"|g' $PARSER_BUILD
             
             # Jsoup
             sed -i 's|libs.jsoup|"org.jsoup:jsoup:1.16.1"|g' $PARSER_BUILD
             
             # QuickJS
             sed -i 's|libs.quickjs|"app.cash.quickjs:quickjs-jvm:0.9.2"|g' $PARSER_BUILD
             
             # JSON
             sed -i 's|libs.json|"org.json:json:20231013"|g' $PARSER_BUILD

             # Testes (JUnit) - Vamos comentar os testes para não perder tempo baixando libs de teste
             sed -i 's|testImplementation(libs.junit.api)|//testImplementation|g' $PARSER_BUILD
             sed -i 's|testImplementation(libs.junit.engine)|//testImplementation|g' $PARSER_BUILD
             sed -i 's|testImplementation(libs.junit.params)|//testImplementation|g' $PARSER_BUILD
             sed -i 's|testRuntimeOnly(libs.junit.launcher)|//testRuntimeOnly|g' $PARSER_BUILD
             
             # Desativa publicação Maven
             sed -i 's|apply(plugin = "maven-publish")|//|g' $PARSER_BUILD
             
             echo "--- ARQUIVO REESCRITO (PREVIEW) ---"
             head -n 30 $PARSER_BUILD
          fi

          echo "--- VERIFICAÇÃO APP ---"
          grep "project" app/build.gradle

      # --- FIM DA INJEÇÃO ---

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Get version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=1.0.0-dev" >> $GITHUB_OUTPUT
            echo "version_code=10000" >> $GITHUB_OUTPUT
          else
            TAG=${GITHUB_REF#refs/tags/}
            VERSION=${TAG#v}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION" 
            PATCH=${PATCH:-0}
            VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
            echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          fi

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > keystore.jks

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PversionName=${{ steps.version.outputs.version }} \
            -PversionCode=${{ steps.version.outputs.version_code }} \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m" \
            -x lint

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: Kotatsu HomeLab ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up keystore
        if: always()
        run: rm -f keystore.jks
