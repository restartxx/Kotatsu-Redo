name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # Permite rodar manualmente sem tag se precisar testar

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout App code
        uses: actions/checkout@v4

      # --- INICIO DA INJEÇÃO DOS PARSERS ---
      
      - name: Checkout Custom Parsers
        uses: actions/checkout@v4
        with:
          # CONFIRA SE O REPO ESTÁ CERTO
          repository: restartxx/kotatsu-parsers-redo 
          path: kotatsu-parsers 
          ref: master

      - name: Patch settings.gradle for Local Parsers
        run: |
          echo "Injetando Composite Build no settings.gradle..."
          
          # Tenta descobrir o nome da dependência automaticamente
          DEPENDENCY_STRING=$(grep -oP "implementation ['\"]com.github.[^:]+:[^:]+" app/build.gradle | head -n1 | sed "s/implementation ['\"]//") || true
          
          if [ -z "$DEPENDENCY_STRING" ]; then
             # Se falhar (ex: app usa kts), usa o padrão do Redo/Kotatsu
             DEPENDENCY_STRING="com.github.KotatsuApp:kotatsu-parsers"
             echo "Aviso: Não achei a string no build.gradle (provavelmente é .kts), usando fallback: $DEPENDENCY_STRING"
          else
             echo "Dependência detectada: $DEPENDENCY_STRING"
          fi

          # Se o arquivo for .kts (Kotlin), o comando de append é diferente, 
          # mas como o Redo ainda usa uma mistura, vamos garantir criando/appendando no settings.gradle (Groovy) 
          # que o Gradle lê com prioridade ou em conjunto.
          
          cat <<EOF >> settings.gradle

          includeBuild('kotatsu-parsers') {
              dependencySubstitution {
                  substitute module('$DEPENDENCY_STRING') using project(':')
              }
          }
          EOF
          
          echo "Verificando final do arquivo settings.gradle:"
          tail -n 10 settings.gradle

      # --- FIM DA INJEÇÃO ---

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Get version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # Se for manual sem tag, cria uma versão fake
            echo "version=1.0.0-dev" >> $GITHUB_OUTPUT
            echo "version_code=10000" >> $GITHUB_OUTPUT
          else
            TAG=${GITHUB_REF#refs/tags/}
            VERSION=${TAG#v}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION" 
            PATCH=${PATCH:-0}
            VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
            echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          fi

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > keystore.jks

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # O flag -x lint ignora erros de formatação pra não falhar o build a toa
          ./gradlew assembleRelease \
            -PversionName=${{ steps.version.outputs.version }} \
            -PversionCode=${{ steps.version.outputs.version_code }} \
            -x lint

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: Kotatsu HomeLab ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up keystore
        if: always()
        run: rm -f keystore.jks
