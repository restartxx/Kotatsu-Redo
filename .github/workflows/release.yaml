name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout App code
        uses: actions/checkout@v4

      # --- INICIO DA INJEÇÃO DOS PARSERS ---
      
      - name: Checkout Custom Parsers
        uses: actions/checkout@v4
        with:
          repository: restartxx/kotatsu-parsers-redo 
          path: kotatsu-parsers 
          ref: master

      - name: Force Local Parsers Module (KSP Fix)
        run: |
          echo "🔥 Aplicando Linkagem Forçada com Correção de Variáveis KSP..."

          # 1. CONFIGURAÇÃO DO SETTINGS.GRADLE
          cat <<EOF >> settings.gradle

          include ':kotatsu-parsers'
          include ':kotatsu-parsers-ksp'
          project(':kotatsu-parsers-ksp').projectDir = new File('kotatsu-parsers/kotatsu-parsers-ksp')
          EOF

          # 2. LINKAGEM NO APP/BUILD.GRADLE
          perl -0777 -i -pe 's|implementation\("com\.github\.clquwu:kotatsu-parsers-redo:\$parsersVersion"\)\s*\{\s*exclude group: \x27org\.json\x27, module: \x27json\x27\s*\}|implementation project(":kotatsu-parsers")|g' app/build.gradle
          
          # ==================================================================================
          # 3. LIMPEZA DOS ARQUIVOS DE BUILD DO PARSER
          # ==================================================================================
          
          # --- ARQUIVO PRINCIPAL (kotatsu-parsers/build.gradle.kts) ---
          PARSER_BUILD="kotatsu-parsers/build.gradle.kts"
          if [ -f "$PARSER_BUILD" ]; then
             echo "Limpando $PARSER_BUILD..."
             sed -i '/import tasks.ReportGenerateTask/d' $PARSER_BUILD
             sed -i '/tasks.register<ReportGenerateTask>/d' $PARSER_BUILD
             
             # Plugins
             sed -i 's|alias(libs.plugins.kotlin.jvm)|id("org.jetbrains.kotlin.jvm")|g' $PARSER_BUILD
             sed -i 's|alias(libs.plugins.kotlin.serialization)|id("org.jetbrains.kotlin.plugin.serialization")|g' $PARSER_BUILD
             sed -i 's|alias(libs.plugins.ksp)|id("com.google.devtools.ksp")|g' $PARSER_BUILD
             
             # Dependências
             sed -i 's|libs.kotlinx.coroutines.core|"org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"|g' $PARSER_BUILD
             sed -i 's|libs.jsoup|"org.jsoup:jsoup:1.16.1"|g' $PARSER_BUILD
             sed -i 's|libs.quickjs|"app.cash.quickjs:quickjs-jvm:0.9.2"|g' $PARSER_BUILD
             sed -i 's|libs.json|"org.json:json:20231013"|g' $PARSER_BUILD
             
             # Remove testes e publicação
             sed -i 's|testImplementation|//testImplementation|g' $PARSER_BUILD
             sed -i 's|testRuntimeOnly|//testRuntimeOnly|g' $PARSER_BUILD
             sed -i 's|apply(plugin = "maven-publish")|//|g' $PARSER_BUILD
          fi

          # --- ARQUIVO DO SUBMÓDULO KSP (kotatsu-parsers-ksp/build.gradle.kts) ---
          KSP_BUILD="kotatsu-parsers/kotatsu-parsers-ksp/build.gradle.kts"
          if [ -f "$KSP_BUILD" ]; then
             echo "Limpando $KSP_BUILD..."
             # Plugins
             sed -i 's|alias(libs.plugins.kotlin.jvm)|id("org.jetbrains.kotlin.jvm")|g' $KSP_BUILD
             
             # --- AQUI ESTAVA O ERRO ---
             # Substituímos especificamente a variável longa que apareceu no seu log
             sed -i 's|libs.ksp.symbol.processing.api|"com.google.devtools.ksp:symbol-processing-api:1.9.20-1.0.14"|g' $KSP_BUILD
             
             # Prevenção para KotlinPoet (muito comum aparecer junto)
             sed -i 's|libs.kotlinpoet.ksp|"com.squareup:kotlinpoet-ksp:1.14.2"|g' $KSP_BUILD
             sed -i 's|libs.kotlinpoet|"com.squareup:kotlinpoet:1.14.2"|g' $KSP_BUILD
             
             # Fallback: Se tiver qualquer outro libs.ksp.* que passou batido, tenta substituir (brute force)
             sed -i 's|libs.ksp.api|"com.google.devtools.ksp:symbol-processing-api:1.9.20-1.0.14"|g' $KSP_BUILD
             
             # Remove publicação e testes
             sed -i 's|apply(plugin = "maven-publish")|//|g' $KSP_BUILD
             
             echo "Conteúdo final do KSP Build (Debug):"
             cat $KSP_BUILD
          fi

          echo "--- VERIFICAÇÃO SETTINGS ---"
          tail -n 5 settings.gradle

      # --- FIM DA INJEÇÃO ---

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Get version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=1.0.0-dev" >> $GITHUB_OUTPUT
            echo "version_code=10000" >> $GITHUB_OUTPUT
          else
            TAG=${GITHUB_REF#refs/tags/}
            VERSION=${TAG#v}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION" 
            PATCH=${PATCH:-0}
            VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
            echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          fi

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > keystore.jks

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PversionName=${{ steps.version.outputs.version }} \
            -PversionCode=${{ steps.version.outputs.version_code }} \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m" \
            -x lint

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: Kotatsu HomeLab ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up keystore
        if: always()
        run: rm -f keystore.jks
