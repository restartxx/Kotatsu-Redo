name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout App code
        uses: actions/checkout@v4

      # --- INICIO DA INJEÇÃO DOS PARSERS ---
      
      - name: Checkout Custom Parsers
        uses: actions/checkout@v4
        with:
          repository: restartxx/kotatsu-parsers-redo 
          path: kotatsu-parsers 
          ref: master

      - name: Force Local Parsers Module (Catalog Fix)
        run: |
          echo "🔥 Aplicando Linkagem Forçada e Corrigindo Catálogo..."

          # 1. Adiciona o módulo no settings.gradle
          echo "include ':kotatsu-parsers'" >> settings.gradle

          # 2. SUBSTITUIÇÃO DA DEPENDÊNCIA (Manteve o Perl que funcionou)
          perl -0777 -i -pe 's|implementation\("com\.github\.clquwu:kotatsu-parsers-redo:\$parsersVersion"\)\s*\{\s*exclude group: \x27org\.json\x27, module: \x27json\x27\s*\}|implementation project(":kotatsu-parsers")|g' app/build.gradle
          
          # 3. CORREÇÃO DOS PLUGINS NO PARSER (O FIX DO ERRO ATUAL)
          # Trocamos alias(libs.plugins...) por id(...) direto para não depender do version catalog
          if [ -f "kotatsu-parsers/build.gradle.kts" ]; then
             echo "Corrigindo build.gradle.kts do parser..."
             sed -i 's|alias(libs.plugins.kotlin.jvm)|id("org.jetbrains.kotlin.jvm")|g' kotatsu-parsers/build.gradle.kts
             sed -i 's|alias(libs.plugins.kotlin.serialization)|id("org.jetbrains.kotlin.plugin.serialization")|g' kotatsu-parsers/build.gradle.kts
             # Removemos qualquer referência a 'libs' que possa quebrar as dependências
             # Troca libs.json por "org.json:json:20230227" (versão comum usada no Android)
             sed -i 's|libs.json|"org.json:json:20230227"|g' kotatsu-parsers/build.gradle.kts
          fi

          # 4. Desabilita publicação
          if [ -f "kotatsu-parsers/build.gradle.kts" ]; then
             sed -i 's|apply(plugin = "maven-publish")|//|g' kotatsu-parsers/build.gradle.kts || true
          fi

          echo "--- VERIFICAÇÃO ---"
          grep "project" app/build.gradle
          head -n 20 kotatsu-parsers/build.gradle.kts

      # --- FIM DA INJEÇÃO ---

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Get version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=1.0.0-dev" >> $GITHUB_OUTPUT
            echo "version_code=10000" >> $GITHUB_OUTPUT
          else
            TAG=${GITHUB_REF#refs/tags/}
            VERSION=${TAG#v}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION" 
            PATCH=${PATCH:-0}
            VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
            echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          fi

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > keystore.jks

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Aumentamos a memória do daemon para evitar erros em builds complexos
          ./gradlew assembleRelease \
            -PversionName=${{ steps.version.outputs.version }} \
            -PversionCode=${{ steps.version.outputs.version_code }} \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m" \
            -x lint

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: Kotatsu HomeLab ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up keystore
        if: always()
        run: rm -f keystore.jks
